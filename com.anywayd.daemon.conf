<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- This policy allows the root user to own the service's well-known name -->
  <policy user="root">
    <allow own="com.anywayd.daemon"/>
  </policy>

  <!-- This policy allows any user to send messages to the service -->
    <policy context="default">
      <allow send_destination="com.anywayd.daemon"/>
    </policy>
</busconfig>
