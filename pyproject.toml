[project]
name = "anywayd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Narendra S", email = "narendra.s1232@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
